version: "3.8"

services:
  linkstack:
    hostname: 'linkstack'
    image: 'linkstackorg/linkstack:latest'
    environment:
      TZ: 'Europe/Berlin'
      SERVER_ADMIN: 'admin@ethan-herring.com'
      HTTP_SERVER_NAME: 'ethan-herring.com'
      HTTPS_SERVER_NAME: 'ethan-herring.com'
      LOG_LEVEL: 'info'
      PHP_MEMORY_LIMIT: '256M'
      UPLOAD_MAX_FILESIZE: '8M'
    volumes:
      - '/htdocs'
    restart: unless-stopped
    user: apache:apache
    networks:
      - proxy_net
    # read_only: true
networks:
  proxy_net:
    external: true
