services:
  couchdb:
    image: couchdb:latest
    container_name: obsidian-livesync-couchdb
    user: "5984:5984"
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - ./couchdb-data:/opt/couchdb/data
      - ./couchdb-etc:/opt/couchdb/etc/local.d
    ports:
      - "5984:5984"
    networks:
      - proxy_net
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" http://localhost:5984/ >/dev/null
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  proxy_net:
    external: true
