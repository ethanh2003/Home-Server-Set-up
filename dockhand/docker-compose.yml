services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    environment:
      DATA_DIR: /home/ethan/docker/dockhand/data
    ports:
      - "3001:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ethan/docker/dockhand/data:/home/ethan/docker/dockhand/data
