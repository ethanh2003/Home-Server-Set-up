x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:latest
    user: 1000:1000
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
    - 9091:9090
    volumes:
    - ./prometheus_config/:/etc/prometheus/
    - ./prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    - --web.enable-remote-write-receiver
    networks:
    - monitoring
    - proxy_net
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:9090 || wget -q --spider http://localhost:9090 ||
        exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  grafana:
    image: grafana/grafana-oss:latest
    user: root
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    - GF_SMTP_ENABLED=true
    - GF_SMTP_HOST=smtp-relay:25
    - GF_SMTP_FROM_ADDRESS=alerts@ethan-herring.com
    - GF_SMTP_FROM_NAME=ethan-mini-s
    volumes:
    - ./grafana_config:/var/lib/grafana
    - /home/ethan/docker/grafana_provisioning:/etc/grafana/provisioning
    ports:
    - 3000:3000
    networks:
    - monitoring
    - proxy_net
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000 || wget -q --spider http://localhost:3000 ||
        exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    logging: *default-logging
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    - ./node_exporter_textfile:/textfile:ro
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --path.rootfs=/rootfs
    - --collector.textfile.directory=/textfile
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
    - monitoring
    ports:
    - 9100:9100
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    container_name: cadvisor
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    command:
    - --docker_only=true
    - --housekeeping_interval=15s
    - --store_container_labels=false
    - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    - --enable_metrics=cpu,memory,network,diskIO,oom_event
    devices:
    - /dev/kmsg
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    - /var/lib/containerd/:/var/lib/containerd:ro
    - /dev/disk/:/dev/disk:ro
    networks:
    - monitoring
    ports:
    - 8086:8080
  loki:
    image: grafana/loki:latest
    user: 1000:1000
    container_name: loki
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 3102:3100
    volumes:
    - ./loki_config:/etc/loki
    - ./loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
    - monitoring
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    logging: *default-logging
    volumes:
    - /var/lib/docker/containers:/var/lib/docker/containers:ro
    - ./promtail_config:/etc/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
    - monitoring
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    logging: *default-logging
    volumes:
    - ./blackbox_config/blackbox.yml:/config/blackbox.yml:ro
    command:
    - --config.file=/config/blackbox.yml
    networks:
    - monitoring
networks:
  monitoring:
    driver: bridge
  proxy_net:
    external: true
