services:
  server:
    build:
      context: ./upstream-your_spotify
      dockerfile: Dockerfile.server.production
    restart: always
    volumes:
      - import_tmp:/tmp/imports
    networks:
      - proxy_net
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      API_ENDPOINT: ${API_ENDPOINT}
      CLIENT_ENDPOINT: ${CLIENT_ENDPOINT}
      SPOTIFY_PUBLIC: ${SPOTIFY_PUBLIC}
      SPOTIFY_SECRET: ${SPOTIFY_SECRET}
      MAX_IMPORT_CACHE_SIZE: ${MAX_IMPORT_CACHE_SIZE}

  web:
    build:
      context: ./upstream-your_spotify
      dockerfile: Dockerfile.client.production
    restart: always
    networks:
      - proxy_net
    environment:
      API_ENDPOINT: ${API_ENDPOINT}

  mongo:
    container_name: mongo
    image: mongo:7
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - mongo_data:/data/db

networks:
  proxy_net:
    external: true

volumes:
  mongo_data:
  import_tmp:
